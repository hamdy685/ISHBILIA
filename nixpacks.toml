providers = ['php', 'node']

[phases.setup]
nixPkgs = ['nodejs_20', 'php83', 'php83Packages.composer']

[phases.build]
cmds = [
    'npm install --include=dev',
    'npm run build',
    'cp -r dist/. public/'
]

[start]
cmd = 'export PHP_CLI_SERVER_WORKERS=30 && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && (php artisan queue:work --sleep=1 --tries=3 &) && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'
